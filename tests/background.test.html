<!doctype html>
<html><head><meta charset="utf-8"><title>背景邏輯測試</title></head>
<body><pre id="out">（尚未執行）</pre>
<script>
// 測試頁自己掛掉時要看得到原因，否則 runner 只會看到「尚未執行」
addEventListener('error', (e) => {
  document.getElementById('out').textContent = `FAIL  測試頁拋出錯誤  →  ${e.message} @ ${e.filename}:${e.lineno}`;
});
addEventListener('unhandledrejection', (e) => {
  document.getElementById('out').textContent =
    `FAIL  測試頁有未處理的 rejection  →  ${e.reason?.stack || e.reason}`;
});
</script>
<script>
// ── 設定與 chrome stub ─────────────────────────────────────────
const SETTINGS = {
  myNames: '小陳, Ken', notes: '我負責金流後端。',
  // summaryDue 是 AND：段數與時間都要成立。這裡把最短間隔設 0，
  // 讓時間條件永遠滿足，測試才能只用段數門檻驅動摘要。
  summaryEverySegments: 3, summaryEveryMs: 0,
  autoAnswer: true,
  // 後端已經寫死：摘要走 Claude Code、即時回答走本機模型，兩者都免費。
  provider: 'claude-code', fastAnswersLocal: true,
  sttEngine: 'whisper-native', sttNativeModel: 'small', sttAuto: true,
};
// 雲端金鑰。預設空的：既有測試驗的是「沒有金鑰時退回免費本機路線」的行為。
const KEYS = {};
window.__broadcasts = [];
window.__fetches = [];
window.__sentToRuntime = [];
// 記錄事件先後，用來驗證「先接串流、後啟動辨識伺服器」的順序
window.__timeline = [];
let onConnectHandler = null, onMessageHandler = null;

window.chrome = {
  runtime: {
    lastError: undefined,
    onInstalled: { addListener: () => {} },
    onStartup: { addListener: () => {} },
    onConnect: { addListener: (fn) => { onConnectHandler = fn; } },
    onMessage: { addListener: (fn) => { onMessageHandler = fn; } },
    // 記錄下來，才能驗證送去 offscreen 的引擎與模型是對的
    sendMessage: async (m) => {
      window.__sentToRuntime.push(m);
      if (m.type === 'ma:offscreen:start') window.__timeline.push('offscreen:start');
      return { ok: true };
    },
  },
  // 點工具列圖示是 Chrome 唯一穩定認可的手勢來源，音訊擷取靠它啟動
  action: { onClicked: { addListener: (fn) => { window.__onActionClicked = fn; } } },
  sidePanel: { setPanelBehavior: async () => {}, open: async () => {} },
  storage: {
    local: {
      get: async (k) => {
        if (k === 'settings') return { settings: SETTINGS };
        // 金鑰跟設定分開存（見 keys.js）。預設是空的 —— 大部分既有測試
        // 驗的是「沒有雲端金鑰時的行為」，所以空值才是對的起點。
        if (k === 'cloudKeys') return Object.keys(KEYS).length ? { cloudKeys: KEYS } : {};
        return {};
      },
      set: async (obj) => { if (obj.cloudKeys) Object.assign(KEYS, obj.cloudKeys); },
    },
  },
  offscreen: { hasDocument: async () => false, createDocument: async () => {}, closeDocument: async () => {} },
  tabCapture: { getMediaStreamId: async () => 'stream-id' },
  // executeScript 用來把「擴充功能已被該分頁叫用過」這個授權補上，
  // 因為側邊欄用 openPanelOnActionClick 開啟時 onClicked 不會觸發。
  // __grantFails 讓測試模擬「連補救也失敗」。
  scripting: {
    executeScript: async () => {
      if (window.__grantFails) throw new Error('Cannot access contents of the page');
      window.__granted = true;
      return [];
    },
  },
  tabs: {
    query: async () => [{ id: 1, windowId: 7 }],
    // 記下每一次截圖的選項：走雲端要 JPEG（PNG 的整頁截圖 base64 之後會撞到
    // 請求大小上限），走橋接才是 PNG 存檔。
    captureVisibleTab: async (winId, opts) => {
      window.__captures.push(opts || {});
      return `data:image/${opts?.format || 'png'};base64,iVBORw0KGgo=`;
    },
  },
  // 截圖要交給 Claude Code 讀檔，所以下載完成後還要查得到絕對路徑
  downloads: {
    download: async (opts) => { window.__downloads.push(opts); return 99; },
    search: async () => [{ id: 99, state: 'complete', filename: 'C:\\Users\\test\\Downloads\\會議助手\\提問畫面-x.png' }],
  },
};
window.__downloads = [];
window.__captures = [];

// Native Messaging stub：模擬 bridge\host.ps1
//
// 現在有兩個模組各自 connectNative（claudecode.js 走 Claude Code，
// whisper-native.js 管本機辨識伺服器），Chrome 會為每條連線各開一個主機程序，
// 所以 stub 也要能同時存在多條。replyAll 廣播給所有連線 —— 回應是靠 id 配對的，
// 送錯連線的訊息會被忽略，所以廣播是安全的。
// autoRun：自動回覆 type:'run'（Claude Code 的推論請求）。
// 摘要現在預設走 Claude Code，而橋接的呼叫端在等不到回覆時會等逾時 ——
// 測試用的是微任務時鐘，setTimeout 永遠不會走到，於是整個測試頁靜靜卡死
// （症狀是 #out 停在「尚未執行」，看起來像頁面沒載入）。
// 後面驗證橋接請求形狀的段落會把它關掉，改成手動回覆。
window.__native = { posted: [], ports: [], port: null, failStt: false, autoRun: true };
window.chrome.runtime.connectNative = () => {
  const port = {
    listeners: [],
    onMessage: { addListener: (fn) => port.listeners.push(fn) },
    onDisconnect: { addListener: () => {} },
    disconnect: () => {},
    // 會自己回覆的訊息型別必須在這裡處理完，否則呼叫端會等它的逾時，
    // 而測試用的是微任務時鐘，setTimeout 永遠不會走到 —— 整個流程就卡住了。
    postMessage: (m) => {
      window.__native.posted.push(m);
      const auto = (r) => Promise.resolve().then(() => port.reply({ id: m.id, ...r }));
      if (m.type === 'ping') auto({ ok: true, text: 'pong' });
      else if (m.type === 'sttStatus') {
        auto({ ok: true, installed: true, running: false, dir: 'C:\\x\\whisper', models: ['ggml-small-q5_1.bin'], port: 8317 });
      } else if (m.type === 'sttStart') {
        window.__timeline.push('sttStart');
        auto(window.__native.failStt
          ? { ok: false, error: '找不到本機辨識程式。請先執行 tools\\install-whisper.ps1。' }
          : { ok: true, reused: false, model: 'ggml-small-q5_1.bin', startMs: 6000, port: 8317 });
      } else if (m.type === 'sttStop') auto({ ok: true });
      else if (m.type === 'run' && window.__native.autoRun) {
        // 純文字摘要格式（Claude Code 不保證支援 JSON schema）
        auto({ ok: true, text: '主題: 金流\n重點: 討論結帳失敗率\n待辦: 王小明|追 API' });
      }
    },
    reply: (msg) => port.listeners.forEach((fn) => fn(msg)),
  };
  window.__native.ports.push(port);
  window.__native.port = port;
  return port;
};
window.__native.replyAll = (msg) => window.__native.ports.forEach((p) => p.reply(msg));

// ── fetch stub：依 body 判斷是串流問答還是非串流摘要 ──────────────
const SUMMARY_JSON = JSON.stringify({
  topics: ['金流'], summary: ['討論結帳失敗率'], decisions: [],
  actions: [{ owner: '小陳', task: '追 API' }], open_questions: [],
});
window.__nextStatus = 200;

// 雲端那幾家是 OpenAI 相容的介面（choices[0].message.content），
// 形狀跟 Anthropic 完全不同，所以要照網址分流。
// __cloudStatus 用網址關鍵字指定「這一家下一次回什麼狀態碼」，
// 用來測 429 冷卻與候選鏈的退避。
window.__cloudStatus = {};
window.__cloudReplies = [];
window.__cloudAlwaysFail = false;
function cloudStubResponse(url, body) {
  const host = url.includes('groq') ? 'groq' : 'nvidia';
  const forced = window.__cloudAlwaysFail ? 503 : window.__cloudStatus[host];
  if (forced && forced !== 200) {
    if (!window.__cloudAlwaysFail) delete window.__cloudStatus[host];
    return {
      ok: false, status: forced,
      headers: { get: (h) => (h.toLowerCase() === 'retry-after' ? '30' : null) },
      json: async () => ({ error: { message: `測試錯誤 ${forced}` } }),
      text: async () => `測試錯誤 ${forced}`,
    };
  }
  const text = window.__cloudReplies.shift() || '第一行答案\n・要點一\n・要點二';
  if (!body.stream) {
    return {
      ok: true, status: 200,
      headers: { get: () => null },
      json: async () => ({ choices: [{ message: { content: text }, finish_reason: 'stop' }] }),
    };
  }
  // OpenAI 風格的 SSE。跟 Anthropic 那組一樣，故意把一個事件切在
  // chunk 邊界上 —— 半行 JSON 直接 parse 會丟例外並中斷整個串流。
  const parts = [
    `data: ${JSON.stringify({ choices: [{ delta: { content: text.slice(0, 3) } }] })}\n\n`,
    `data: ${JSON.stringify({ choices: [{ delta: { content: text.slice(3) } }] }).slice(0, 20)}`,
    `${JSON.stringify({ choices: [{ delta: { content: text.slice(3) } }] }).slice(20)}\n\n`,
    'data: [DONE]\n\n',
  ];
  const enc = new TextEncoder();
  let i = 0;
  return {
    ok: true, status: 200,
    headers: { get: () => null },
    body: { getReader: () => ({
      read: async () => (i < parts.length ? { done: false, value: enc.encode(parts[i++]) } : { done: true }),
    }) },
  };
}

window.fetch = async (url, opts) => {
  const u = String(url);

  // Tavily 收的是查詢，回的是搜尋結果，跟聊天完全不同
  if (u.includes('api.tavily.com')) {
    window.__fetches.push({ url: u, headers: opts.headers, body: JSON.parse(opts.body) });
    if (window.__tavilyFails) return { ok: false, status: 432, json: async () => ({}) };
    return { ok: true, status: 200, json: async () => ({
      answer: '目前的營所稅率是 20%。',
      results: [{ title: '財政部公告', url: 'https://example.gov.tw/tax', content: '營所稅率 20%。' }],
    }) };
  }

  if (u.includes('api.groq.com') || u.includes('integrate.api.nvidia.com')) {
    const body = JSON.parse(opts.body);
    window.__fetches.push({ url: u, headers: opts.headers, body });
    return cloudStubResponse(u, body);
  }

  const body = JSON.parse(opts.body);
  window.__fetches.push({ url: u, headers: opts.headers, body });

  if (window.__nextStatus !== 200) {
    const status = window.__nextStatus;
    window.__nextStatus = 200;
    return { ok: false, status, json: async () => ({ error: { message: '測試錯誤' } }) };
  }

  if (!body.stream) {
    return { ok: true, status: 200, json: async () => ({
      content: [{ type: 'text', text: SUMMARY_JSON }], usage: {}, stop_reason: 'end_turn', model: body.model,
    }) };
  }

  // SSE：故意把一個事件切在 chunk 邊界上，驗證緩衝處理
  const parts = [
    'event: message_start\ndata: {"type":"message_start"}\n\n',
    'event: content_block_delta\ndata: {"type":"content_block_delta","delta":{"type":"text_delta","text":"對帳 API "}}\n\n',
    'event: content_block_delta\ndata: {"type":"content_block_del',
    'ta","delta":{"type":"text_delta","text":"預計 8/20 開通。"}}\n\n',
    'event: message_delta\ndata: {"type":"message_delta","delta":{"stop_reason":"end_turn"}}\n\n',
  ];
  const enc = new TextEncoder();
  let i = 0;
  return { ok: true, status: 200, body: { getReader: () => ({
    read: async () => (i < parts.length ? { done: false, value: enc.encode(parts[i++]) } : { done: true }),
  }) } };
};
</script>

<script src="store.test.js"></script>
<script>
// service-worker.js 用 `import * as store`。__module_store 由 run.ps1 的轉換器
// 從實際的匯出自動產生，所以新增匯出時不必回來手動補（以前漏過）。
window.store = window.__module_store;
</script>
<script src="settings.test.js"></script>
<script src="localmodel.test.js"></script>
<script src="claudecode.test.js"></script>
<script src="keys.test.js"></script>
<script src="cloud.test.js"></script>

<script>
(async () => {
  const results = [];
  const check = (n, c, e = '') => results.push(`${c ? 'PASS' : 'FAIL'}  ${n}${c ? '' : '  →  ' + e}`);
  const settle = () => new Promise((r) => setTimeout(r, 0));
  try {

  // 假的側邊欄連線，用來收 broadcast（並保留關閉它的方法）
  //
  // autoLocal：自動回覆 localRun（本機模型的推論請求）。即時回答現在預設走
  // 本機模型，而它會等側邊欄回 ma:local:done —— 測試裡沒人回的話就永遠等下去，
  // 整個測試頁靜靜卡死（症狀是 #out 停在「尚未執行」）。
  // 後面驗證委派內容的段落會把它關掉，改成手動回覆。
  window.__autoLocal = true;
  let onPanelDisconnect = null;
  onConnectHandler({
    name: 'ma-panel',
    postMessage: (m) => {
      window.__broadcasts.push(m);
      if (m.type === 'localRun' && window.__autoLocal) {
        Promise.resolve().then(() => onMessageHandler(
          { type: 'ma:local:done', id: m.payload.id, text: '（本機模型的回答）' }, {}, () => {}));
      }
    },
    onDisconnect: { addListener: (fn) => { onPanelDisconnect = fn; } },
  });
  window.__closePanel = () => onPanelDisconnect?.();
  const got = (type) => window.__broadcasts.filter((b) => b.type === type);

  const send = (msg) => new Promise((resolve) => { onMessageHandler(msg, {}, resolve); });
  const seg = (id, speaker, text) => ({
    type: 'ma:segment',
    payload: { id, speaker, text, final: true, ts: Date.now(), startedAt: Date.now(),
      source: 'captions', platform: 'google-meet', sessionId: 'sess1', title: '週會', url: 'https://meet.google.com/x' },
  });

  check('註冊了 onConnect 與 onMessage', !!onConnectHandler && !!onMessageHandler);

  // ── 一般陳述句不該觸發回答 ──────────────────────────────────
  await send(seg('s1', '王小明', '我們先看金流的部分'));
  await settle();
  check('陳述句不觸發回答建議', got('answer').length === 0, `${got('answer').length} 則`);

  // ── 沒點名我的問句也不該觸發 ────────────────────────────────
  await send(seg('s2', '王小明', '這個數字是從哪來的？'));
  await settle();
  check('未點名的問句不觸發回答', got('answer').length === 0, `${got('answer').length} 則`);

  // ── 點名我的問句要觸發回答 ──────────────────────────────────
  // 回答走本機模型（免費、1–3 秒），細部的串流行為在後面的免費路線區塊驗證。
  await send(seg('s3', '李美華', '小陳，對帳 API 什麼時候會開通？'));
  await settle(); await settle(); await settle();
  check('點名我時觸發回答建議', got('answer').length === 1, `${got('answer').length} 則`);

  // ── 名字和問句分在不同段落時仍然要觸發 ──────────────────────
  //
  // **這是實測回報的迴歸。** 逐字稿改成「一句一段」（為了讓每一句各自對上
  // 說話者）之後，原本會自動回答的問題突然都不回答了 —— 因為在那之前
  // 一整塊 28 秒的音訊是**一個**段落，名字和問句剛好都在裡面。切細之後
  // 那個巧合就不見了，而人本來就不會把名字和問題塞進同一句話：
  //
  //   「小陳，」→「成本優勢明顯，」→「這個是在哪裡體現？」
  //
  // 所以「有沒有點到我」要看前後一小段對話，不能只看這一段。
  const splitBefore = got('answer').length;
  const t0 = Date.now();
  const part = (id, text, offset) => ({
    type: 'ma:segment',
    payload: { id, speaker: '李美華', text, final: true, ts: t0 + offset, startedAt: t0 + offset,
      source: 'audio', platform: 'audio-fallback', sessionId: 'sess1', title: '週會' },
  });
  await send(part('sp1', '小陳，', 0));
  await send(part('sp2', '成本優勢明顯，', 1500));
  await send(part('sp3', '這個是在哪裡體現？', 3000));
  await settle(); await settle(); await settle();
  check('名字在前一句、問句在後一句時仍然自動回答',
    got('answer').length === splitBefore + 1,
    `多了 ${got('answer').length - splitBefore} 則`);
  check('回答卡片上的問題是那個問句本身，不是整塊 28 秒的內容',
    got('answer').at(-1)?.payload.question === '這個是在哪裡體現？',
    got('answer').at(-1)?.payload.question);

  // 一塊音訊會切成好幾句，其中可能有兩三句都像問句 —— 沒有這道防線的話
  // 同一次「有人問你」會產生兩三張卡片，每一張都燒一次額度。
  const throttleBefore = got('answer').length;
  await send(part('sp4', '那有沒有數字可以看？', 4000));
  await settle(); await settle();
  check('同一次點名只回答一次（一塊音訊切成好幾句，可能有兩三句都像問句）',
    got('answer').length === throttleBefore,
    `多了 ${got('answer').length - throttleBefore} 則`);

  // 超過 20 秒就不算同一段對話了，名字不該無限期地「延續」下去
  const farBefore = got('answer').length;
  await send(part('sp5', '這個要怎麼處理？', 60000));
  await settle(); await settle();
  check('離點名太久的問句不觸發（名字不會無限期延續）',
    got('answer').length === farBefore,
    `多了 ${got('answer').length - farBefore} 則`);

  // ── 介面文字不該進逐字稿 ────────────────────────────────────
  // 選擇器失效時抓到的是 Meet 自己的 UI。實測那份逐字稿裡真的出現過
  // 「arrow_downward跳到底部」—— 混進去會一路汙染摘要與回答建議。
  const beforeJunk = store.getState().segments.length;
  await send(seg('j1', '未標註', 'arrow_downward跳到底部'));
  await send(seg('j2', '未標註', '按下一鍵即可開啟數位鍵盤系統窗，按 Esc 鍵即可關閉'));
  await send(seg('j3', '未標註', 'arrow_drop_down'));
  await settle();
  check('Meet 的介面文字不會進逐字稿',
    store.getState().segments.length === beforeJunk,
    `多了 ${store.getState().segments.length - beforeJunk} 段`);

  // 正常的句子不能被誤擋
  await send(seg('j4', '王小明', '我們先把預算這件事確認一下'));
  await settle();
  check('正常句子不會被介面文字過濾誤擋',
    store.getState().segments.length === beforeJunk + 1,
    `多了 ${store.getState().segments.length - beforeJunk} 段`);

  // ── 摘要：達到門檻自動觸發 ──────────────────────────────────
  check('累積到門檻自動產生摘要', !!store.getState().summary,
    JSON.stringify(store.getState().summary));
  check('摘要結果已存入 store', store.getState().summary?.summary?.length > 0,
    JSON.stringify(store.getState().summary?.summary));
  check('摘要結果已廣播到側邊欄', got('summary').length >= 1);

  // ── 完全不呼叫任何會計費的 API ──────────────────────────────
  // 這是「只花 Claude Pro 訂閱的錢」的迴歸測試：付費後端整個移除之後，
  // 不論摘要或回答都不該有任何一次 api.anthropic.com 的請求。
  check('沒有呼叫 Claude API（不會產生費用）',
    !window.__fetches.some((f) => String(f.url || '').includes('api.anthropic.com')),
    JSON.stringify(window.__fetches.map((f) => f.url)));

  // ── 手動提問 ────────────────────────────────────────────────
  const before = got('answer').length;
  await send({ type: 'ma:ask', question: '預算還剩多少？' });
  await settle(); await settle(); await settle();
  check('手動提問也會產生回答', got('answer').length === before + 1);

  // ── 匯出 ────────────────────────────────────────────────────
  const exported = await send({ type: 'ma:export' });
  check('匯出 Markdown 含逐字稿', exported?.markdown?.includes('我們先看金流的部分'));
  check('匯出 Markdown 含待辦', exported?.markdown?.includes('追 API'));

  // ── 會議分頁的 id 由 content script 回報，側邊欄要問得到 ────────
  // 側邊欄是獨立情境，chrome.tabs.query({active:true}) 可能給到別的分頁；

  await new Promise((resolve) => onMessageHandler(

  // 這是 Chrome 官方認可的手勢來源。側邊欄裡的 click 實測會被拒
  // （"Chrome pages cannot be captured"），所以真正能動的是這條路。
  check('有註冊工具列圖示的點擊處理', typeof window.__onActionClicked === 'function');
  window.__sentToRuntime.length = 0;
  await window.__onActionClicked({ id: 88, url: 'https://meet.google.com/abc-defg-hij' });

  check('在會議分頁點圖示會直接開始聆聽',

  check('在非會議分頁點圖示不會啟動擷取',
    !window.__sentToRuntime.some((m) => m.type === 'ma:offscreen:start'),

  // ── 聽會議聲音：沒金鑰時要走本機引擎，而不是拒絕 ──────────────

  window.__sentToRuntime.length = 0;
  const audio = await send({ type: 'ma:audio:start', streamId: 'stream-id' });

  const offStart = window.__sentToRuntime.find((m) => m.type === 'ma:offscreen:start');
  check('送去 offscreen 的引擎是原生 whisper',
    offStart?.engine === 'whisper-native', JSON.stringify(offStart?.engine));
  check('把本機伺服器的網址交給 offscreen（音訊走 HTTP，不走 native messaging 的 1MB 上限）',
    offStart?.options?.endpoint === 'http://127.0.0.1:8317/inference', JSON.stringify(offStart?.options));
  check('原生引擎預設用 small 模型（中文準確度差距很大）',
    offStart?.options?.model === 'small', JSON.stringify(offStart?.options?.model));
  check('預設要求把結果轉成繁體', offStart?.options?.toTraditional === true);
  check('本機引擎不需要金鑰就能啟動', !offStart?.deepgramKey);
  check('已經沒有雲端辨識這條路（不會意外計費）',

  check('有請橋接把辨識伺服器拉起來',

    JSON.stringify(window.__native.posted.map((m) => m.type)));

  // **順序：offscreen 先接串流，辨識伺服器後啟動。**
  // getMediaStreamId 拿到的 id 幾秒內沒用掉就失效，而 sttEnsure 冷啟動要
  // 好幾秒。反過來的話 getUserMedia 會拿到過期的 id —— 擷取靜靜失敗，
  // 狀態卻顯示「聆聽中」，講再多話都沒有逐字稿，也沒有任何錯誤訊息。
  const offAt = window.__timeline.indexOf('offscreen:start');
  const sttAt = window.__timeline.indexOf('sttStart');
  check('先把串流交給 offscreen，再啟動辨識伺服器（串流 id 會過期）',

    `順序：${JSON.stringify(window.__timeline)}`);

  await send({ type: 'ma:audio:stop' });
  check('停止擷取時會把辨識伺服器收掉（small 模型約 400MB 記憶體）',
    window.__native.posted.some((m) => m.type === 'sttStop'),
    JSON.stringify(window.__native.posted.map((m) => m.type)));

  // ── 原生引擎裝不起來 → 自動退到瀏覽器內建，而不是整個功能失敗 ──

  const notesBefore = got('audioNote').length;
  const fallback = await send({ type: 'ma:audio:start', streamId: 'stream-id' });

  check('有告知使用者換了引擎、以及怎麼裝回原生的',

  window.__native.failStt = false;
  await send({ type: 'ma:audio:stop' });

  // ── 沒有 streamId 就不該啟動 ────────────────────────────────
  // streamId 是側邊欄在使用者手勢裡取得的。背景自己拿不到（手勢不跨
  // sendMessage 傳過來），所以少了它只能請使用者去按那顆按鈕。
  const noStream = await send({ type: 'ma:audio:start' });
  check('沒有 streamId 時指向「開始聆聽」按鈕',

  // ── offscreen 啟動失敗時不能留下一台沒人管的辨識伺服器 ─────────

  const realSend = window.chrome.runtime.sendMessage;
  window.chrome.runtime.sendMessage = async (m) => {

  window.__native.posted.length = 0;

  check('offscreen 失敗時還沒開辨識伺服器（不必收拾）',

  window.chrome.runtime.sendMessage = realSend;

  await send({ type: 'ma:audio:stop' });

  // ── 設定頁的「檢查本機原生辨識」 ────────────────────────────

    JSON.stringify(sttInfo));

  // ── 設定遷移：舊使用者停在舊引擎上會不知道有更好的可用 ────────
  // 遷移是**鏈式**的：第 2 版把 WASM 換成原生，第 5 版再把原生換成雲端。
  // 所以一個從第 1 版一路升上來的使用者最後會落在 groq —— 每一段都只是

  SETTINGS.sttEngine = 'whisper';

  const migrated = await getSettings();
  check('舊設定會一路遷移到目前的預設引擎（WASM → 原生 → 雲端）',
    migrated.sttEngine === 'groq', migrated.sttEngine);
  SETTINGS.schemaVersion = 2;
  const kept = await getSettings();
  check('已遷移過之後就尊重使用者的選擇，不再改動',
    kept.sttEngine === 'whisper', kept.sttEngine);
  delete SETTINGS.sttEngine;
  delete SETTINGS.schemaVersion;

  // ══ 預設：摘要與問答都走 Claude Code ═══════════════════════
  // Chrome 內建的 Gemini Nano 不支援中文輸出（outputLanguage 只接受

  const defaultInfo = await send({ type: 'ma:provider' });

  SETTINGS.fastAnswersLocal = true;
  SETTINGS.schemaVersion = 4;
  const info = await send({ type: 'ma:provider' });

  check('免費模型需要側邊欄', info?.needsPanel === true && info.panelReachable === true);

  await settle(); await settle();
  const runs = got('localRun');

  check('推論委派到側邊欄執行', runs.length === 1, `${runs.length} 次`);

  check('委派內容含問題本身', runs[0]?.payload.user.includes('剛剛李美華問的問題'), runs[0]?.payload.user);

  // 模擬側邊欄把結果串流回來

  await send({ type: 'ma:local:delta', id: runId, chunk: '回答預計 8/20 開通。' });
  await send({ type: 'ma:local:done', id: runId, text: '她問的是對帳 API，回答預計 8/20 開通。' });
  await askPromise; await settle();
  const localAnswer = store.getState().answers.at(-1);
  check('免費模型的回答有收回來並存好',

  check('免費模型的回答有廣播 answerDone', got('answerDone').length >= 1);

  // ── 摘要用純文字格式，不用 JSON schema ──────────────────────

  window.__native.autoRun = false;

  const sumRun = window.__native.posted.find((m) => m.type === 'run');
  check('摘要走 Claude Code（Pro 額度，免費）', !!sumRun,

  check('摘要改用純文字格式指示', sumRun?.system.includes('主題: 詞1, 詞2'),

    '決議: 先處理第三方對帳',
    '待辦: 小陳|追 API 開通進度',
    '問題: 對帳 API 何時開通',
  ].join('\n') });
  await sumPromise; await settle();
  const sum = store.getState().summary;
  check('純文字摘要解析出主題', JSON.stringify(sum?.topics) === '["金流","對帳"]', JSON.stringify(sum?.topics));
  check('純文字摘要解析出重點', sum?.summary[0] === '結帳失敗率上週 2.3%', JSON.stringify(sum?.summary));
  check('純文字摘要解析出負責人與事項',

  await send({ type: 'ma:summarizeNow' });
  await settle(); await settle();
  check('側邊欄關閉時摘要仍然正常，不噴錯誤', got('error').length === errsBefore,
    got('error').slice(errsBefore).map((e) => e.payload.message).join(' | '));

  // ══ Claude Code 路線（用 Pro 訂閱額度，不按量計費）════════════

  onConnectHandler({

    postMessage: (m) => window.__broadcasts.push(m),
    onDisconnect: { addListener: () => {} },

  SETTINGS.fastAnswersLocal = true;

  check('摘要走 Claude Code', ccInfo?.provider === 'claude-code', JSON.stringify(ccInfo?.provider));
  check('即時回答自動改走本機模型（Claude Code 太慢）',
    ccInfo?.answerProvider === 'chrome-ai', JSON.stringify(ccInfo?.answerProvider));
  check('兩者都免費', ccInfo?.free === true);
  check('回報需要橋接', ccInfo?.needsBridge === true);

  window.__native.autoRun = false;
  window.__native.posted.length = 0;

  const apiBefore = window.__fetches.length;
  const ccSum = send({ type: 'ma:summarizeNow' });
  await settle(); await settle();
  const runMsg = window.__native.posted.find((m) => m.type === 'run');
  check('摘要送到 Claude Code 橋接', !!runMsg,
    `posted=${JSON.stringify(window.__native.posted)} 最近錯誤=${got('error').slice(-2).map((e) => e.payload.message).join(' ; ')}`);
  if (!runMsg) throw new Error('橋接沒收到請求，後續測試無法進行');
  check('Claude Code 路線不呼叫 API', window.__fetches.length === apiBefore);
  check('橋接請求含逐字稿', runMsg?.user.includes('我們先看金流的部分'), (runMsg?.user || '').slice(0, 60));
  check('橋接請求用純文字格式（CLI 不保證 JSON schema）',
    runMsg?.system.includes('主題: 詞1, 詞2'), (runMsg?.system || '').slice(-80));

  window.__native.replyAll({ id: runMsg.id, ok: true, text: [
    '主題: 預算',
    '重點: 預算還有兩成沒動用',
    '待辦: 李美華|下週提預算報告',
  ].join('\n') });
  await ccSum; await settle(); await settle();
  const ccSummary = store.getState().summary;
  check('Claude Code 的摘要有解析並存好',
    ccSummary?.summary[0] === '預算還有兩成沒動用', JSON.stringify(ccSummary?.summary));
  check('Claude Code 的待辦解析出負責人',
    ccSummary?.actions[0]?.owner === '李美華', JSON.stringify(ccSummary?.actions));

  // 即時回答仍然走本機模型，不走橋接
  const nativeBefore = window.__native.posted.length;
  const localBefore = got('localRun').length;
  send({ type: 'ma:ask', question: '預算的事怎麼回？' });
  await settle(); await settle();
  check('即時回答不走橋接', window.__native.posted.length === nativeBefore,
    JSON.stringify(window.__native.posted.slice(nativeBefore)));
  check('即時回答走本機模型', got('localRun').length === localBefore + 1);

  SETTINGS.fastAnswersLocal = false;

  check('關掉開關後回答改走 Claude Code', info2?.answerProvider === 'claude-code', info2?.answerProvider);

  // ══ 自架 Jitsi 網域 → match pattern ═════════════════════════════
  // 使用者會用各種方式輸入，全部要能收斂成合法的 pattern
  const pats = jitsiPatterns('jitsi.mycompany.com, https://meet.example.org/room123  8x8.vc');

  check('不合法的輸入被丟掉',
    jitsiPatterns('localhost, 不是網域, ., http://').length === 0,
    JSON.stringify(jitsiPatterns('localhost, 不是網域, ., http://')));
  check('空字串不會產生 pattern', jitsiPatterns('').length === 0);

  SETTINGS.fastAnswersLocal = false;      // 讓即時回答也走 Claude Code

  send({ type: 'ma:ask', question: '畫面上那張圖的數字是多少？', withScreen: true });
  await settle(); await settle(); await settle();

  check('附畫面時會存一張截圖', !!shot && shot.filename.includes('提問畫面'),
    JSON.stringify(shot || null));
  const imgRun = window.__native.posted.slice(nativeCount).find((m) => m.type === 'run');
  check('截圖的絕對路徑有送給 Claude Code',
    imgRun?.imagePath === 'C:\\Users\\test\\Downloads\\會議助手\\提問畫面-x.png', imgRun?.imagePath);
  check('附畫面時仍然帶著逐字稿', imgRun?.user?.includes('畫面上那張圖') === true, (imgRun?.user || '').slice(0, 40));
  check('答案卡片有收到「正在讀取會議畫面」的說明',
    got('answerNote').some((n) => n.payload.note.includes('會議畫面')),
    JSON.stringify(got('answerNote').map((n) => n.payload.note)));

  // 沒勾選時不該白白截圖
  const shotsNow = window.__downloads.length;
  send({ type: 'ma:ask', question: '不用看畫面' });
  await settle(); await settle();
  check('沒勾選附畫面就不截圖', window.__downloads.length === shotsNow);

  // 本機模型看不懂圖片 → 這一題升級到 Claude Code，而不是回一句「我看不懂」
  // 即時回答平常走本機模型（fastAnswersLocal），所以要先把它打開才測得到升級

  const shotsLocal = window.__downloads.length;

    window.__downloads.length === shotsLocal + 1, `多了 ${window.__downloads.length - shotsLocal} 張`);
  check('這一題改走 Claude Code 而不是本機模型',
    got('localRun').length === localRunsBefore

    JSON.stringify(window.__native.posted.slice(nativeBefore2).map((m) => m.type)));
  check('有告知使用者為什麼換了後端',
    got('answerNote').some((n) => n.payload.note.includes('改用 Claude Code')),
    JSON.stringify(got('answerNote').map((n) => n.payload.note)));

  // 沒勾附畫面時，本機模型照舊處理（不該因為上面的升級邏輯而改變）
  const localRuns2 = got('localRun').length;
  send({ type: 'ma:ask', question: '純文字問題' });
  await settle(); await settle();
  check('沒勾附畫面時本機模型照舊處理', got('localRun').length === localRuns2 + 1);

  // ══ 這台機器跑不動 Gemini Nano 時的退路 ═══════════════════════
  // Nano 要 >4GB VRAM 與 >22GB 可用磁碟，很多筆電（含這台）達不到。
  // 側邊欄偵測到之後會寫回 localModelUnsupported，免費路線要自動改走
  // Claude Code，而不是安靜地什麼都不做。
  SETTINGS.fastAnswersLocal = true;
  SETTINGS.localModelUnsupported = true;

  const noNano = await send({ type: 'ma:provider' });
  check('本機模型跑不動時摘要改走 Claude Code', noNano?.provider === 'claude-code', noNano?.provider);
  check('本機模型跑不動時即時回答也改走 Claude Code（忽略「回答用本機模型」開關）',
    noNano?.answerProvider === 'claude-code', noNano?.answerProvider);
  check('退路仍然是免費的', noNano?.free === true);
  check('退路會提示需要橋接', noNano?.needsBridge === true && noNano?.needsPanel === false,
    JSON.stringify({ bridge: noNano?.needsBridge, panel: noNano?.needsPanel }));
  check('回報本機模型不支援，給 UI 顯示用', noNano?.localUnsupported === true);

  // 付費路線已整個移除：不論設定怎麼放，都不可能解析出會計費的後端。
  // 這是「只花 Claude Pro 訂閱的錢」這條原則的迴歸測試。
  SETTINGS.provider = 'claude';          // 就算硬塞舊值
  SETTINGS.apiKey = 'sk-ant-test';       // 就算殘留舊金鑰
  const forced = await send({ type: 'ma:provider' });
  check('硬塞付費後端也不會生效（只花 Pro 訂閱的錢）',
    forced?.provider !== 'claude' && forced?.answerProvider !== 'claude' && forced?.free === true,
    JSON.stringify({ p: forced?.provider, a: forced?.answerProvider, free: forced?.free }));
  delete SETTINGS.apiKey;
  SETTINGS.provider = 'claude-code';
  SETTINGS.localModelUnsupported = false;

  // ══ 雲端免費方案（Groq／NVIDIA NIM）════════════════════════════

  // ── 金鑰的形狀檢查 ────────────────────────────────────────────
  // 貼錯欄位是最常見又最難查的錯：症狀是 401，而 401 看起來像「金鑰過期」，
  // 使用者會跑去重新簽發一把新的，然後再貼錯一次。
  check('把 Groq 金鑰貼到 NVIDIA 欄位會被抓出來',
    mismatchedKeys({ groq: 'gsk_x', nvidia: 'gsk_wrong' }).some((m) => m.field === 'nvidia'));
  check('正確的字首不會誤報',
    mismatchedKeys({ groq: 'gsk_x', nvidia: 'nvapi-y', tavily: 'tvly-z' }).length === 0);
  check('沒填的欄位不算貼錯', mismatchedKeys({ groq: '', nvidia: '' }).length === 0);

  // 這個頁面會出現在截圖與螢幕分享裡，完整金鑰絕對不能回到畫面上。
  // 假金鑰一律含大寫 FAKE —— check-project.ps1 的金鑰外洩掃描靠這個約定
  // 分辨「測試用的假貨」與「不小心貼進來的真金鑰」。
  const secret = 'gsk_FAKEmiddlepartmustnotappear0123456789';
  check('遮罩不會洩漏完整金鑰', !maskKey(secret).includes('middlepartmustnotappear'), maskKey(secret));
  check('遮罩仍留頭尾方便辨認是哪一把',
    maskKey(secret).startsWith('gsk_FAKE') && maskKey(secret).endsWith('6789'), maskKey(secret));
  check('沒設定時顯示得出來', maskKey('') === '（未設定）');

  // ── 設定頁的「測試」按鈕 ──────────────────────────────────────
  // 實際的操作順序是「貼上 → 測試 → 才儲存」，所以要測得到**還沒存**的那把。
  // 只測已儲存的話，剛貼完金鑰的人會收到「沒有填金鑰」，
  // 而他明明看得到金鑰就在框裡 —— 那種訊息會讓人跑去重新簽發一把新的。
  window.__fetches.length = 0;
  const typedTest = await send({ type: 'ma:keys:test', vendor: 'groq', key: 'gsk_FAKEtypedbutnotsavedyet000000' });
  check('測試用的是輸入框裡那把（還沒儲存也能測）', typedTest?.ok === true, JSON.stringify(typedTest));
  check('真的拿那把去打 API',
    window.__fetches.some((f) => f.headers?.Authorization === 'Bearer gsk_FAKEtypedbutnotsavedyet000000'),
    JSON.stringify(window.__fetches.map((f) => f.headers?.Authorization)));

  // 兩邊都沒有金鑰時要分得出「沒東西可測」與「金鑰被拒」——
  // 兩者該告訴使用者的下一步完全不同
  const nothingToTest = await send({ type: 'ma:keys:test', vendor: 'groq' });
  check('兩邊都沒金鑰時回報 noKey，而不是含糊的錯誤',
    nothingToTest?.ok === false && nothingToTest?.noKey === true, JSON.stringify(nothingToTest));

  // ── 沒有金鑰時不能解析成雲端 ──────────────────────────────────
  // 回傳 'cloud' 卻沒有金鑰的話，每一次呼叫都要先失敗一輪才退回橋接 ——
  // 使用者看到的是「每次都慢 20 秒」，而不是「你沒設定金鑰」。
  SETTINGS.provider = 'cloud';
  const noKeys = await send({ type: 'ma:provider' });
  check('沒有金鑰時不會解析成雲端',
    noKeys?.provider === 'claude-code' && noKeys?.answerProvider !== 'cloud',
    JSON.stringify({ p: noKeys?.provider, a: noKeys?.answerProvider }));
  check('沒有金鑰時如實回報未設定', noKeys?.cloudConfigured === false);

  // ── 有金鑰之後才走雲端 ────────────────────────────────────────
  KEYS.groq = 'gsk_test';
  KEYS.nvidia = 'nvapi-test1';
  KEYS.nvidia2 = 'nvapi-test2';
  const withKeys = await send({ type: 'ma:provider' });
  check('有金鑰時摘要與回答都走雲端',
    withKeys?.provider === 'cloud' && withKeys?.answerProvider === 'cloud',
    JSON.stringify({ p: withKeys?.provider, a: withKeys?.answerProvider }));
  check('雲端一樣是免費的（免費方案，不是按量計費）', withKeys?.free === true);
  check('回報金鑰已設定', withKeys?.cloudConfigured === true);

  // ── 附上會議畫面：雲端沒有視覺模型，所以要升級到橋接 ────────────
  //
  // 這裡一度改成「雲端自己看」，填了 meta-llama/llama-4-scout 與 …-maverick，
  // **兩個都回 404**。實際去問 Groq 的 /models（tools\list-groq-models.ps1）
  // 得到的 15 個模型裡一個視覺模型都沒有：只有兩支 whisper、llama-3.1/3.3、
  // gpt-oss、qwen3.6、compound。所以看畫面仍然只有橋接做得到。
  //
  // 這一項守的是「不要再猜一次模型名稱」：名稱錯的症狀是 404，
  // 而 404 在畫面上跟「額度用完」長得很像（都是「雲端不能用，改走退路」），
  // 使用者只會覺得變慢了。
  SETTINGS.provider = 'cloud';
  window.__fetches.length = 0;
  window.__captures.length = 0;
  const visionBridgeBefore = window.__native.posted.length;
  await send({ type: 'ma:ask', question: '畫面上那張圖的數字是多少？', withScreen: true });
  await settle(); await settle(); await settle();

  check('雲端不會被當成看得懂圖片（Groq 沒有任何視覺模型）',
    !window.__fetches.some((f) => JSON.stringify(f.body?.messages || '').includes('image_url')),
    JSON.stringify(window.__fetches.map((f) => f.body?.model)));
  const visionRun = window.__native.posted.slice(visionBridgeBefore).find((m) => m.type === 'run');
  check('附畫面時升級到橋接，並把截圖路徑交給它',
    !!visionRun?.imagePath, JSON.stringify(visionRun?.imagePath || null));
  check('有告訴使用者為什麼換了後端（雲端 0.7 秒，橋接 10–30 秒）',
    got('answerNote').some((n) => n.payload.note.includes('看不懂圖片')),
    JSON.stringify(got('answerNote').slice(-3).map((n) => n.payload.note)));

  // 沒勾就不該白白截圖
  window.__fetches.length = 0;
  window.__captures.length = 0;
  await send({ type: 'ma:ask', question: '不用看畫面' });
  await settle(); await settle();
  check('沒勾附畫面時不截圖', window.__captures.length === 0, JSON.stringify(window.__captures));

  // 輸入框空著時回頭測已儲存的那把
  window.__fetches.length = 0;
  const storedTest = await send({ type: 'ma:keys:test', vendor: 'groq' });
  check('輸入框空著時測已儲存的金鑰', storedTest?.ok === true, JSON.stringify(storedTest));
  check('用的是已儲存的那把',
    window.__fetches.some((f) => f.headers?.Authorization === 'Bearer gsk_test'),
    JSON.stringify(window.__fetches.map((f) => f.headers?.Authorization)));

  // NVIDIA 兩個帳號各測各的，不能都測到同一把
  window.__fetches.length = 0;
  await send({ type: 'ma:keys:test', vendor: 'nim' });
  await send({ type: 'ma:keys:test', vendor: 'nim2' });
  const nimAuths = window.__fetches.map((f) => f.headers?.Authorization);
  check('NVIDIA 帳號 1 與帳號 2 分別測到各自的金鑰',
    nimAuths.includes('Bearer nvapi-test1') && nimAuths.includes('Bearer nvapi-test2'),
    JSON.stringify(nimAuths));

  // ── 送出去的請求形狀 ──────────────────────────────────────────
  window.__fetches.length = 0;
  const okRes = await cloudComplete({
    role: 'answer',
    system: [{ type: 'text', text: '你是助手' }],
    messages: [{ role: 'user', content: '小陳問我：對帳進度？' }],
  });
  const req = window.__fetches.find((f) => f.url.includes('groq'));
  check('回答走 Groq', !!req, JSON.stringify(window.__fetches.map((f) => f.url)));
  check('用 Bearer 帶金鑰', req?.headers?.Authorization === 'Bearer gsk_test', req?.headers?.Authorization);
  check('回答用的是不吐思考過程的模型（要秒回）',
    req?.body?.model === 'llama-3.3-70b-versatile', req?.body?.model);
  check('system 區塊被攤平成 system 訊息',
    req?.body?.messages?.[0]?.role === 'system' && req.body.messages[0].content === '你是助手',
    JSON.stringify(req?.body?.messages?.[0]));
  check('使用者訊息照原樣帶過去',
    req?.body?.messages?.[1]?.content === '小陳問我：對帳進度？',
    JSON.stringify(req?.body?.messages?.[1]));
  // 形狀必須跟 ccComplete 一致，否則雲端失敗時的退路是壞的，
  // 而且只有在雲端失敗的時候才會被發現
  check('回傳形狀跟 Claude Code 一致（text ＋ stopReason）',
    typeof okRes.text === 'string' && okRes.stopReason === 'end_turn',
    JSON.stringify({ t: typeof okRes.text, s: okRes.stopReason }));

  // ── 摘要與回答刻意用不同模型 ──────────────────────────────────
  // Groq 的免費額度是「每個模型一個桶」，分開用等於把可用額度變兩份，
  // 而且摘要吃掉的 token 不會排擠到「被點名時要秒回」這件事。
  window.__fetches.length = 0;
  await cloudComplete({ role: 'summary', prompt: '整理重點' });
  const sumReq = window.__fetches.find((f) => f.url.includes('groq'));
  check('摘要用的是另一個模型（額度分桶）',
    sumReq?.body?.model === 'openai/gpt-oss-120b' && sumReq.body.model !== req?.body?.model,
    sumReq?.body?.model);

  // ── 推理模型的 <think> 要切掉 ─────────────────────────────────
  // 沒切的話側邊欄會顯示一大段英文思考過程，使用者要自己在裡面找答案
  window.__cloudReplies.push('<think>Let me consider the options…</think>對帳 8/20 開通。');
  const thought = await cloudComplete({ role: 'answer', prompt: 'x' });
  check('思考過程被切掉，只留答案',
    thought.text === '對帳 8/20 開通。', JSON.stringify(thought.text));

  // ── 429 之後換下一個候選，而且記住冷卻 ────────────────────────
  window.__fetches.length = 0;
  window.__cloudStatus.groq = 429;
  const afterLimit = await cloudComplete({ role: 'answer', prompt: 'x' });
  check('Groq 撞到額度時自動換下一個候選', afterLimit.text.length > 0);
  check('換過去的是同一家的另一個模型或 NVIDIA',
    window.__fetches.length >= 2, `只打了 ${window.__fetches.length} 次`);

  // ── 串流 ──────────────────────────────────────────────────────
  window.__cloudReplies.push('對帳 API 8/20 開通，退款流程同步調整。');
  const deltas = [];
  const streamed = await cloudStream({ role: 'answer', prompt: 'x', onDelta: (d) => deltas.push(d) });
  check('串流拿得到完整內容',
    streamed.text === '對帳 API 8/20 開通，退款流程同步調整。', JSON.stringify(streamed.text));
  check('真的是逐塊送達（SSE 事件被切在 chunk 邊界也要接得起來）',
    deltas.length > 1 && deltas.join('') === streamed.text,
    JSON.stringify({ n: deltas.length, joined: deltas.join('') }));

  // 還沒吐字的失敗可以重試；上層看到 CloudUnavailable 才知道要退回橋接。
  // 丟原始的 Error 的話 withFallback 不會接手 —— 回答就直接死掉。
  window.__cloudStatus.groq = 500;
  const deltas2 = [];
  const retried = await cloudStream({ role: 'answer', prompt: 'x', onDelta: (d) => deltas2.push(d) });
  check('串流第一個候選失敗時換下一個（還沒吐字，重試是安全的）',
    !!retried.text, JSON.stringify(retried));

  // 完全沒有候選時一定要是 CloudUnavailable，不能是別的例外
  const savedForStream = { ...KEYS };
  delete KEYS.groq; delete KEYS.nvidia; delete KEYS.nvidia2;
  let streamErr = null;
  try { await cloudStream({ role: 'answer', prompt: 'x', onDelta: () => {} }); } catch (e) { streamErr = e; }
  check('串流沒有後端可用時丟 CloudUnavailable（上層才會退回橋接）',
    streamErr instanceof CloudUnavailable, String(streamErr && streamErr.name));
  Object.assign(KEYS, savedForStream);

  // ── 全部不通時丟 CloudUnavailable，讓上層可以退回橋接 ──────────
  const savedKeys = { ...KEYS };
  delete KEYS.groq; delete KEYS.nvidia; delete KEYS.nvidia2;
  let cloudErr = null;
  try { await cloudComplete({ role: 'answer', prompt: 'x' }); } catch (e) { cloudErr = e; }
  check('沒有任何金鑰時丟出 CloudUnavailable（上層才知道要退路）',
    cloudErr instanceof CloudUnavailable, String(cloudErr));
  Object.assign(KEYS, savedKeys);

  // ── 雲端整條死掉時，回答仍然出得來，而且使用者被告知 ────────────
  // 這是整個退路設計的核心：0.7 秒變成 10–30 秒，不講的話使用者只會
  // 覺得「今天特別慢」，然後去懷疑自己的網路。
  SETTINGS.provider = 'cloud';
  SETTINGS.autoAnswer = true;
  window.__cloudAlwaysFail = true;
  window.__native.autoRun = true;   // 前面的區塊可能關掉了，退路要靠它回覆
  window.__broadcasts.length = 0;
  // ma:ask 立刻回覆、答案在背景跑，所以要把佇列排乾才看得到結果
  await send({ type: 'ma:ask', question: '對帳進度如何？' });
  await settle(); await settle(); await settle(); await settle();
  const answered = window.__broadcasts.filter((b) => b?.type === 'answerDone');
  check('雲端全掛時回答仍然產生得出來（退回 Claude Code）',
    answered.length >= 1 && !!answered[answered.length - 1]?.payload?.answer,
    JSON.stringify(answered.map((a) => a?.payload?.answer)));
  check('而且明確告訴使用者換了後端、會慢很多',
    window.__broadcasts.some((b) => b?.type === 'answerNote'
      && /雲端後端暫時不可用/.test(b?.payload?.note || '')),
    JSON.stringify(window.__broadcasts.filter((b) => b?.type === 'answerNote').map((b) => b?.payload?.note)));

  // 關掉退路的人要拿到明確的失敗，而不是一個安靜變慢的後端
  SETTINGS.cloudFallbackToBridge = false;
  window.__broadcasts.length = 0;
  await send({ type: 'ma:ask', question: '再問一次' });
  await settle(); await settle(); await settle(); await settle();
  const done = window.__broadcasts.filter((b) => b?.type === 'answerDone');
  check('關掉退路時如實失敗（不安靜降級）',
    done.length >= 1 && !!done[done.length - 1]?.payload?.error,
    JSON.stringify(done.map((d) => d?.payload?.error)));
  delete SETTINGS.cloudFallbackToBridge;
  window.__cloudAlwaysFail = false;

  // ── 沒有金鑰時，聆聽會退回本機辨識而不是安靜失敗 ───────────────
  const keepGroq = KEYS.groq;
  delete KEYS.groq;
  SETTINGS.sttEngine = 'groq';
  window.__sentToRuntime.length = 0;
  window.__broadcasts.length = 0;
  await send({ type: 'ma:audio:start', streamId: 'stream-id' });
  const startMsg = window.__sentToRuntime.find((m) => m.type === 'ma:offscreen:start');
  check('沒有 Groq 金鑰時改用本機引擎',
    startMsg?.engine === 'whisper-native', startMsg?.engine);
  check('而且明確告訴使用者為什麼（不安靜降級）',
    window.__broadcasts.some((b) => /Groq 金鑰/.test(b?.payload?.message || '')),
    JSON.stringify(window.__broadcasts.map((b) => b?.payload?.message).filter(Boolean)));
  await send({ type: 'ma:audio:stop' });
  KEYS.groq = keepGroq;

  // ── 有金鑰時金鑰會傳給 offscreen ──────────────────────────────
  window.__sentToRuntime.length = 0;
  // 記下這一刻的位置，後面才分得出「這一輪送了什麼」與「前一輪留下的」——
  // 直接看最後幾則會撈到上一段測試的 sttStart，然後誤判成雲端也啟動了伺服器
  const nativeMarkCloud = window.__native.posted.length;
  await send({ type: 'ma:audio:start', streamId: 'stream-id' });
  const cloudStart = window.__sentToRuntime.find((m) => m.type === 'ma:offscreen:start');
  check('有金鑰時用雲端辨識', cloudStart?.engine === 'groq', cloudStart?.engine);
  check('金鑰隨啟動訊息傳給 offscreen',
    cloudStart?.options?.groqKey === 'gsk_test', String(cloudStart?.options?.groqKey));
  check('用的是 turbo 模型',
    cloudStart?.options?.groqSttModel === 'whisper-large-v3-turbo', cloudStart?.options?.groqSttModel);
  // 雲端不需要啟動本機辨識伺服器 —— 白啟動會佔住 400 MB 記憶體
  const nativeAfter = window.__native.posted.slice(nativeMarkCloud);
  check('走雲端時不會去啟動本機辨識伺服器',
    !nativeAfter.some((m) => m.type === 'sttStart'),
    JSON.stringify(nativeAfter.map((m) => m.type)));
  await send({ type: 'ma:audio:stop' });

  // ── Tavily：只在需要外部事實時才查 ────────────────────────────
  check('提到法規要查證', needsSearch('這個新的個資法規定我們要怎麼做？'));
  check('提到最新消息要查證', needsSearch('最新的匯率是多少？'));
  check('直接要求查證', needsSearch('你幫我查一下這家競品的資料'));
  // 會議內部的問題不該浪費查詢額度，也不該多花 1–2 秒
  check('會議內部的問題不查證', needsSearch('剛剛那個失敗率是多少？') === false);
  check('問我的看法不查證', needsSearch('你覺得這樣可行嗎？') === false);
  check('太短的字串不查證', needsSearch('嗯？') === false);

  KEYS.tavily = 'tvly-test';
  const found = await searchWeb('最新的營所稅率');
  check('沒有 Tavily 金鑰時直接跳過查證（不會白打一次網路）',
    (await (async () => { const k = KEYS.tavily; delete KEYS.tavily;
      const r = await searchWeb('x'); KEYS.tavily = k; return r; })()).ok === false);
  check('查證結果整理成可以塞進提示詞的文字',
    formatForPrompt(found).includes('營所稅率') && formatForPrompt(found).includes('example.gov.tw'),
    formatForPrompt(found).slice(0, 60));
  // 查證只是加分，失敗不該讓整個回答失效
  window.__tavilyFails = true;
  const failed = await searchWeb('最新的營所稅率');
  check('查證失敗不會丟例外（回答仍然要出得來）', failed.ok === false && !!failed.error, JSON.stringify(failed));
  check('查證失敗時不會產生提示詞區塊', formatForPrompt(failed) === '');
  window.__tavilyFails = false;

  // ── 查證真的接在回答流程上 ────────────────────────────────────
  // 這條路只有在問題「看起來需要外部資料」時才會走到，所以很容易寫壞了
  // 卻一直沒被發現 —— 平常的測試問題都不會觸發它。
  SETTINGS.provider = 'cloud';
  window.__broadcasts.length = 0;
  window.__fetches.length = 0;
  await send(seg('q-web', '李美華', '小陳，最新的營所稅率會影響我們的預估嗎？'));
  await settle(); await settle(); await settle(); await settle();
  check('需要外部資料的問題會先查一次網路',
    window.__fetches.some((f) => String(f.url).includes('api.tavily.com')),
    JSON.stringify(window.__fetches.map((f) => f.url)));
  check('查證結果會被塞進送給模型的提示詞裡',
    window.__fetches.some((f) => String(f.url).includes('groq')
      && JSON.stringify(f.body?.messages || '').includes('網路查證')),
    JSON.stringify(window.__fetches.filter((f) => String(f.url).includes('groq')).map((f) => String(JSON.stringify(f.body?.messages)).slice(0, 120))));

  // ── 沒有付費端點 ──────────────────────────────────────────────
  // 這是「不接受任何按量計費」的迴歸測試。Groq／NIM／Tavily 三家走的都是
  // 免費方案（撞到上限回 429，不會變成帳單），api.anthropic.com 則是按量計費。
  check('整場測試都沒有打過任何按量計費的端點',
    !window.__fetches.some((f) => String(f.url || '').includes('api.anthropic.com')),
    JSON.stringify(window.__fetches.map((f) => f.url).filter((u) => u.includes('anthropic'))));

  // ══ 說話者姓名：從字幕借過來，一句一句對 ══════════════════════
  //
  // whisper **完全不做說話者分離** —— 回來的就是一整段文字。真實姓名只有
  // 平台字幕有，所以音訊段落要靠「說話時間」去對字幕記到的人。
  // 使用者第一眼就會問「為什麼每個人都叫其他人」，答案就在這條路上。
  const T = 1700000000000;
  const cap = (id, speaker, text, startedAt, ts) => ({
    type: 'ma:segment',
    payload: { id, speaker, text, final: true, ts: ts ?? startedAt, startedAt,
      source: 'captions', platform: 'google-meet', sessionId: 'sess-name', title: '週會',
      url: 'https://meet.google.com/name' },
  });
  const heard = (id, text, startedAt) => ({
    type: 'ma:segment',
    payload: { id, speaker: '其他人（雲端辨識）', text, final: true, ts: Date.now(), startedAt,
      source: 'audio', platform: 'audio-fallback', sessionId: 'sess-name', title: '音訊備援' },
  });
  const speakerOf = (id) => store.getState().segments.find((s) => s.id === id)?.speaker;

  // 字幕先記下「誰在什麼時間區間講話」。音訊在跑的時候字幕不進逐字稿，
  // 只提供姓名 —— 所以要先讓狀態變成聆聽中。
  await send(cap('c-init', 'Eden', '開場', T - 60000));
  await settle();
  store.setStatus({ audioFallback: true });

  // Eden 講了 8 秒（字幕會被串流改寫，同一句定稿多次 → 區間會被延長）
  await send(cap('c1', 'Eden', '那我開始今天的報告', T, T + 4000));
  await send(cap('c1', 'Eden', '那我開始今天的報告，先看第一頁', T, T + 8000));
  // 換人
  await send(cap('c2', 'Mei', '準備好就可以開始了', T + 12000, T + 15000));
  await settle();

  // 一塊 28 秒的音訊被切成三句，每句帶自己的絕對說話時間
  await send(heard('a1', '那我開始今天的報告，先看第一頁。', T + 1000));
  await send(heard('a2', '這一頁是上週的數字。', T + 6000));
  await send(heard('a3', '準備好就可以開始了。', T + 13000));
  await settle();

  check('落在 Eden 區間裡的那句掛給 Eden', speakerOf('a1') === 'Eden', speakerOf('a1'));
  // 這一句在 Eden 那段話的第 6 秒 —— 只記「時間點」的舊做法會因為離 Mei
  // 的起點比較近而掛錯人，記「區間」才對得起來。
  check('同一個人講了 8 秒，後半段仍然掛給他（區間比對，不是找最近的點）',
    speakerOf('a2') === 'Eden', speakerOf('a2'));
  check('換人之後的那句掛給 Mei', speakerOf('a3') === 'Mei', speakerOf('a3'));

  // 離所有區間都太遠就寧可留佔位標籤。掛錯人在畫面上看起來完全正常，
  // 只有當事人自己看得出不對，而摘要與回答建議已經被帶歪了。
  await send(heard('a4', '這是很久以後才說的話。', T + 120000));
  await settle();
  check('離所有字幕都太遠時不硬掛，保留佔位標籤',
    speakerOf('a4') === '其他人（雲端辨識）', speakerOf('a4'));

  // ── 不用開字幕的姓名來源：畫面上的發言指示器 ──────────────────
  //
  // 字幕要使用者自己在會議裡開啟，那一步很容易漏掉（也常常根本不想開），
  // 於是整份逐字稿每一段都是「其他人」。Meet／Teams／Jitsi 都會在畫面上
  // 標出正在說話的人，content script 讀到之後就走這條路進來。
  await send({ type: 'ma:speaking', payload: { names: ['陳大文'], at: T + 300000 } });
  await settle();
  await send(heard('a6', '這段是靠畫面上的發言指示器認出來的。', T + 300500));
  await settle();
  check('沒有字幕也能靠發言指示器補上姓名',
    speakerOf('a6') === '陳大文', speakerOf('a6'));

  // 兩個人同時被判定在講話時沒有辦法歸屬。content script 那邊已經擋掉，
  // 背景這裡再擋一次 —— 這條路的資料來自 DOM，不能假設它一定乾淨。
  await send({ type: 'ma:speaking', payload: { names: ['甲', '乙'], at: T + 400000 } });
  await settle();
  await send(heard('a7', '這時候兩個人同時在講。', T + 400200));
  await settle();
  check('兩個人同時在講時不硬掛名字',
    speakerOf('a7') === '其他人（雲端辨識）', speakerOf('a7'));

  // 回報是每 1.5 秒一次的心跳，區間要往後補一段 ——
  // 只記到「這一刻」的話，兩次心跳之間的音訊會落在區間外面而對不上。
  await send({ type: 'ma:speaking', payload: { names: ['林小美'], at: T + 500000 } });
  await settle();
  await send(heard('a8', '這句話在兩次心跳之間。', T + 501200));
  await settle();
  check('兩次心跳之間的音訊仍然對得上',
    speakerOf('a8') === '林小美', speakerOf('a8'));

  // ── 聲紋分群 ＋ 一次對上名字，之後就記住 ──────────────────────
  //
  // **這是讓姓名撐得住的關鍵。** 字幕和發言指示器都是間歇性的：字幕斷斷續續，
  // 而切到共享畫面時 Teams／Meet 連視訊磚都不顯示，指示器與名牌一起消失 ——
  // 偏偏那正是最需要逐字稿的場合。
  //
  // 聲紋分群是連續的：同一個人的聲音永遠落在同一群。所以只要在**任何一刻**
  // 替某一群對上過一次真名，之後那一群的每一段都能顯示真名。
  // 沒有這張對照表的話，姓名的覆蓋率就等於字幕的覆蓋率，而那個覆蓋率很低。
  const heardIn = (id, text, startedAt, cluster) => ({
    type: 'ma:segment',
    payload: { id, speaker: `講者 ${cluster}`, text, final: true, ts: Date.now(), startedAt,
      source: 'audio', platform: 'audio-fallback', cluster, sessionId: 'sess-name', title: '音訊備援' },
  });

  // 這一刻有指示器說是 Eden 在講話，而這段聲音是第 3 群
  await send({ type: 'ma:speaking', payload: { names: ['Eden'], at: T + 600000 } });
  await settle();
  await send(heardIn('v1', '那我開始今天的報告。', T + 600200, 3));
  await settle();
  check('有線索時用真名', speakerOf('v1') === 'Eden', speakerOf('v1'));

  // 後來畫面切到共享畫面：沒有視訊磚、沒有指示器、字幕也沒開。
  // 但同一個聲音（第 3 群）仍然叫得出名字。
  await send(heardIn('v2', '這一頁是上週的數字。', T + 900000, 3));
  await settle();
  check('線索消失之後，同一個聲音仍然顯示真名（這才是重點）',
    speakerOf('v2') === 'Eden', speakerOf('v2'));

  // 沒對上過的那一群仍然是「講者 N」—— 不能因為記住了一個人就亂猜別人
  await send(heardIn('v3', '我補一個數字。', T + 900500, 5));
  await settle();
  check('沒對上過的聲音仍然是「講者 N」，不會被亂安名字',
    speakerOf('v3') === '講者 5', speakerOf('v3'));

  // 同一群後來對上了不同的名字（分群錯了、或換人用同一支麥克風）→ 以當下為準
  await send({ type: 'ma:speaking', payload: { names: ['林小美'], at: T + 950000 } });
  await settle();
  await send(heardIn('v4', '換我講。', T + 950200, 5));
  await settle();
  check('當下的線索優先於記住的名字', speakerOf('v4') === '林小美', speakerOf('v4'));

  // 選擇器失效時「說話者」會抓到介面文字，那絕對不能被安到某段音訊頭上
  await send(cap('c3', 'arrow_drop_down', '展開', T + 200000, T + 200000));
  await send(heard('a5', '這句話沒有可信的姓名來源。', T + 200500));
  await settle();
  check('字幕抓到介面文字時不會被當成人名',
    speakerOf('a5') === '其他人（雲端辨識）', speakerOf('a5'));

  // ── 手動「產生重點」提早返回時也要收尾 ────────────────────────
  //
  // 側邊欄按下「✦ 產生重點」時會**先**把按鈕切成「產生中…」並停用，再送訊息
  // 過來（不那樣做的話中間的空窗會讓人以為沒按到）。所以背景只要提早返回
  // 而沒有補一則 running:false，那顆按鈕就永遠停在「產生中…」——
  // 使用者唯一的救法是關掉側邊欄重開，而畫面上完全看不出發生了什麼事。
  //
  // 自動摘要不受影響（它沒有先把 UI 切過去），所以只有 force 那條要收尾。
  await send({ type: 'ma:clear' });
  await settle();
  window.__broadcasts.length = 0;
  await send({ type: 'ma:summarizeNow' });
  await settle(); await settle();
  const bail = got('summaryStatus');
  check('沒有逐字稿時手動產生重點會回一則「結束了」，按鈕才不會卡在產生中',
    bail.length >= 1 && bail.at(-1).payload.running === false,
    JSON.stringify(bail.map((b) => b.payload)));
  check('而且不會真的去打模型（沒有東西可以整理）',
    !bail.some((b) => b.payload.running === true),
    JSON.stringify(bail.map((b) => b.payload)));

  SETTINGS.provider = 'claude-code';
  SETTINGS.sttEngine = 'whisper-native';

  } catch (err) {
    // 中斷也要把已完成的結果印出來，否則看不出斷在哪一步
    results.push(`FAIL  測試中斷  →  ${err.stack || err}`);
  }

  const failed = results.filter((x) => x.startsWith('FAIL')).length;
  document.getElementById('out').textContent =
    results.join('\n') + '\n---\n' + (failed === 0 ? `全部 ${results.length} 項通過` : `${failed} 項失敗`);
})();
</script>
</body></html>

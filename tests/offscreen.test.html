<!doctype html>
<html><head><meta charset="utf-8"><title>會議助手 測試 — 音訊處理</title></head>
<body>
<pre id="out"></pre>

<script>
// offscreen.js 只在頂層註冊一個 onMessage listener，所以用 stub 載入是安全的。
// 測的是裡面的純函式與佇列邏輯，不碰真的音訊裝置。
const sent = [];
window.chrome = {
  runtime: {
    onMessage: { addListener: () => {} },
    sendMessage: (m) => { sent.push(m); },
    getURL: (p) => p,
    lastError: undefined,
  },
};
</script>
<!-- 順序要和 offscreen.html 一致：轉換表先載入，offscreen.js 才看得到 toTraditional -->
<script src="s2t-table.js"></script>
<script src="s2t.js"></script>
<script src="voiceprint.js"></script>
<script src="offscreen.js"></script>

<script>
const results = [];
const check = (name, cond, detail = '') =>
  results.push(`${cond ? 'PASS' : 'FAIL'}  ${name}${cond ? '' : `  →  ${detail}`}`);

(async () => {

// ── stripOverlap：分段之間留 2 秒重疊，交界的話不能被記錄兩次 ─────
check('切掉與上一段重疊的開頭',
  stripOverlap('我們先看金流的部分，失敗率是', '失敗率是百分之三') === '百分之三',
  stripOverlap('我們先看金流的部分，失敗率是', '失敗率是百分之三'));

check('完全不重疊時原樣保留',
  stripOverlap('我們先看金流的部分', '那預算呢') === '那預算呢');

check('沒有上一段時原樣保留',
  stripOverlap('', '第一段話') === '第一段話');

check('空的新段落不會爆',
  stripOverlap('前一段', '') === '');

// 太短的相同片段不該被當成重疊 —— 中文兩三個字重複很常見
check('只有兩個字相同時不算重疊',
  stripOverlap('這樣就可以了', '了解，我來處理') === '了解，我來處理',
  stripOverlap('這樣就可以了', '了解，我來處理'));

check('整段都是重複時會被清空',
  stripOverlap('失敗率是百分之三', '失敗率是百分之三') === '',
  `「${stripOverlap('失敗率是百分之三', '失敗率是百分之三')}」`);

// ── rms：Whisper 對靜音會產生幻覺文字，必須先擋掉 ────────────────
const silence = new Float32Array(16000);                       // 全 0
const speech = Float32Array.from({ length: 16000 }, (_, i) => Math.sin(i / 8) * 0.3);
check('靜音的 RMS 低於門檻', rms(silence) < 0.004, String(rms(silence)));
check('有聲音的 RMS 高於門檻', rms(speech) > 0.004, String(rms(speech)));

// ── downsample：分頁音訊是 48kHz，模型要 16kHz ──────────────────
const src48 = Float32Array.from({ length: 4800 }, (_, i) => i / 4800);
const out16 = downsample(src48, 48000);
check('降取樣後長度是三分之一', out16.length === 1600, String(out16.length));
check('降取樣保留了訊號的形狀',
  Math.abs(out16[0] - 0) < 0.01 && Math.abs(out16[out16.length - 1] - 1) < 0.01,
  `${out16[0]} … ${out16[out16.length - 1]}`);
check('取樣率相同時不做處理', downsample(src48, 16000).length === src48.length);

// ── isNoiseOnly：whisper 對靜音／音樂會吐括號標記，不該進逐字稿 ──
check('[BLANK_AUDIO] 被視為雜訊', isNoiseOnly('[BLANK_AUDIO]'));
check('（音樂）被視為雜訊', isNoiseOnly('（音樂）'));
check('【掌聲】被視為雜訊', isNoiseOnly('  【掌聲】 '));
check('句中有括號的正常句子不算雜訊', isNoiseOnly('失敗率（不含退款）是三成') === false);
check('正常句子不算雜訊', isNoiseOnly('那我們下週再看') === false);

// whisper 的中文訓練資料含大量帶字幕的影片，聽到近似靜音時會吐出字幕組
// 署名。實測的逐字稿裡真的出現過「字幕by索蘭婭」。
check('字幕組署名被視為幻覺', isNoiseOnly('字幕by索蘭婭'));
check('簡體的字幕署名也擋掉', isNoiseOnly('字幕by索兰娅'));
check('「請不吝點贊訂閱」被視為幻覺', isNoiseOnly('请不吝点赞订阅转发打赏'));
check('單獨的「謝謝大家」被視為幻覺', isNoiseOnly('謝謝大家'));
check('CP950 壞掉時的 MUQ 被視為幻覺', isNoiseOnly('MUQ'));
// 但正常語境裡出現「謝謝」不該被擋
check('句子裡的謝謝不算幻覺', isNoiseOnly('謝謝大家今天的討論，那就先這樣') === false);

// ── toWavBlob：whisper-server 收的是 WAV 檔，不是原始樣本 ────────
const wav = toWavBlob(new Float32Array([0, 0.5, -0.5, 1, -1]), 16000);
const bytes = new DataView(await wav.arrayBuffer());
const tag = (at) => String.fromCharCode(bytes.getUint8(at), bytes.getUint8(at + 1), bytes.getUint8(at + 2), bytes.getUint8(at + 3));
check('WAV 大小是 44 位元組表頭加 16-bit 樣本', wav.size === 44 + 5 * 2, String(wav.size));
check('RIFF/WAVE/fmt/data 四個標記都在', tag(0) === 'RIFF' && tag(8) === 'WAVE' && tag(12) === 'fmt ' && tag(36) === 'data',
  `${tag(0)}/${tag(8)}/${tag(12)}/${tag(36)}`);
check('宣告成 16kHz 單聲道 16-bit PCM',
  bytes.getUint16(20, true) === 1 && bytes.getUint16(22, true) === 1
  && bytes.getUint32(24, true) === 16000 && bytes.getUint16(34, true) === 16,
  `fmt=${bytes.getUint16(20, true)} ch=${bytes.getUint16(22, true)} rate=${bytes.getUint32(24, true)} bits=${bytes.getUint16(34, true)}`);
check('樣本被夾在 int16 範圍內（±1 不會溢位）',
  bytes.getInt16(44 + 6, true) === 32767 && bytes.getInt16(44 + 8, true) === -32768,
  `${bytes.getInt16(44 + 6, true)} / ${bytes.getInt16(44 + 8, true)}`);

// ── handleResult：簡體結果要轉成繁體才進逐字稿 ───────────────────
sent.length = 0;
lastResultText = '';
toTraditionalOn = true;
handleResult('我先讲一下这季的目标，结账失败率要压到百分之一以下。', 1700000000000);
const seg = sent.find((m) => m.type === 'ma:segment')?.payload;
check('辨識結果會轉成繁體（台灣用字）',
  seg?.text === '我先講一下這季的目標，結帳失敗率要壓到百分之一以下。', seg?.text);
check('說話時間用的是傳入的 startedAt，不是現在',
  seg?.startedAt === 1700000000000, String(seg?.startedAt));
check('說話者標成本機辨識', seg?.speaker === '其他人（本機辨識）', seg?.speaker);

sent.length = 0;
lastResultText = '';
toTraditionalOn = false;
handleResult('这季的目标', 1);
check('關掉繁體轉換時原樣送出',
  sent.find((m) => m.type === 'ma:segment')?.payload.text === '这季的目标',
  sent.find((m) => m.type === 'ma:segment')?.payload.text);

sent.length = 0;
lastResultText = '';
handleResult('[BLANK_AUDIO]', 1);
check('純雜訊的結果不會產生逐字稿段落',
  sent.some((m) => m.type === 'ma:segment') === false);

// ── 跟不上的處置：丟最舊的，並自動把分段拉長 ─────────────────────
// transcribe 是 null，所以 pump 什麼都不做，佇列只會累積 —— 正好用來測丟棄邏輯。
sent.length = 0;
pending = [];
dropped = 0;
chunkSec = 12;
transcribe = null;
for (let i = 0; i < 4; i++) enqueue(new Float32Array(10), 1000 + i);
check('積壓時只留最新的一段', pending.length === 1, `佇列 ${pending.length} 段`);
check('丟掉的段數有記錄', dropped === 3, String(dropped));
// 改成 VAD 切段之後不再自動拉長分段：段落長度由「講多久」決定，
// 硬拉長只會把兩句話黏成一段，反而更難讀。落後仍然要回報（見下一項）。
check('不再自動拉長分段（VAD 切段下段落長度由句子決定）',
  chunkSec === 12, String(chunkSec));
check('第一次落後就回報錯誤橫幅',
  sent.filter((m) => m.type === 'ma:audioError').length === 1,
  `${sent.filter((m) => m.type === 'ma:audioError').length} 次`);

// 拉長是有上限的：超過 whisper 的 30 秒窗反而要多跑一輪編碼器
chunkSec = 30;
dropped = 0;
sent.length = 0;
for (let i = 0; i < 4; i++) enqueue(new Float32Array(10), 2000 + i);
check('分段長度不會超過 30 秒', chunkSec === 30, String(chunkSec));

// ── nativeTranscribe：走 HTTP 到 127.0.0.1 的原生引擎 ───────────
let lastRequest = null;
window.fetch = async (url, opts) => {
  lastRequest = { url, opts };
  return { ok: true, status: 200, json: async () => ({ text: ' 这是原生结果 ' }) };
};
nativeEndpoint = 'http://127.0.0.1:8317/inference';
chunkSec = 12;
const nativeText = await nativeTranscribe(new Float32Array(160));
check('原生引擎打的是本機 127.0.0.1 的 /inference',
  lastRequest?.url === 'http://127.0.0.1:8317/inference', String(lastRequest?.url));
check('用 POST 送出', lastRequest?.opts?.method === 'POST', String(lastRequest?.opts?.method));
check('音訊以 multipart 表單的 file 欄位送出',
  lastRequest?.opts?.body instanceof FormData && lastRequest.opts.body.get('file') instanceof Blob);
check('要求 json 格式的回應', lastRequest?.opts?.body?.get('response_format') === 'json');
check('原生結果原樣回傳（繁體轉換在 handleResult 才做）',
  nativeText === ' 这是原生结果 ', `「${nativeText}」`);

window.fetch = async () => ({ ok: false, status: 503, json: async () => ({}) });
let threw = '';
try { await nativeTranscribe(new Float32Array(160)); } catch (e) { threw = e.message; }
check('伺服器回非 200 時丟出可讀的錯誤', threw.includes('503'), threw);

// ── 雲端辨識（Groq） ────────────────────────────────────────────
// 這是預設引擎：同一段 16.6 秒的中文樣本，RTF 0.06（本機原生 small 是 0.47），
// 而且逐字稿一字未錯。
window.fetch = async (url, opts) => {
  lastRequest = { url, opts };
  return { ok: true, status: 200, headers: { get: () => null }, json: async () => ({
    text: ' 这是云端结果 ',
    // verbose_json 會多回每一句的相對秒數，那是「一句一個說話者」的基礎
    segments: [{ start: 0, end: 2.5, text: ' 这是云端结果 ' }],
  }) };
};
engineName = 'groq';
cloudKey = 'gsk_test';
cloudModel = 'whisper-large-v3-turbo';
cloudPrompt = '以下是繁體中文（台灣）的會議逐字稿。';
const cloudText = await groqTranscribe(new Float32Array(160));

check('雲端辨識打的是 Groq 的 transcriptions 端點',
  lastRequest?.url === 'https://api.groq.com/openai/v1/audio/transcriptions', String(lastRequest?.url));
check('用 Bearer 帶金鑰',
  lastRequest?.opts?.headers?.Authorization === 'Bearer gsk_test',
  String(lastRequest?.opts?.headers?.Authorization));
check('指定 turbo 模型',
  lastRequest?.opts?.body?.get('model') === 'whisper-large-v3-turbo',
  String(lastRequest?.opts?.body?.get('model')));
// 指定語言可以省掉模型自己偵測的那一步，也避免中文被誤判成日文
check('指定語言為中文', lastRequest?.opts?.body?.get('language') === 'zh');
// 提示詞在這裡是用來指定書寫系統：不給會吐簡體，給繁體提示詞就直接吐繁體
check('帶繁體提示詞（用來指定書寫系統）',
  String(lastRequest?.opts?.body?.get('prompt')).includes('繁體'),
  String(lastRequest?.opts?.body?.get('prompt')));
check('temperature 設 0（辨識要可重現）', lastRequest?.opts?.body?.get('temperature') === '0');
// whisper 完全不做說話者分離，姓名只能靠「說話時間」去對字幕。一次請求的
// 音訊會被合併到 28 秒，所以必須拿到**每一句**的時間，不然整段 28 秒
// 都會掛在同一個人頭上。
check('要求 verbose_json（才拿得到每一句的時間）',
  lastRequest?.opts?.body?.get('response_format') === 'verbose_json',
  String(lastRequest?.opts?.body?.get('response_format')));
check('要求逐句的時間戳',
  lastRequest?.opts?.body?.get('timestamp_granularities[]') === 'segment',
  String(lastRequest?.opts?.body?.get('timestamp_granularities[]')));
check('雲端結果原樣回傳（繁體轉換在 handleResult 才做）',
  cloudText?.text === ' 这是云端结果 ', `「${cloudText?.text}」`);
check('每一句的相對秒數有帶回來',
  cloudText?.parts?.length === 1 && cloudText.parts[0].start === 0,
  JSON.stringify(cloudText?.parts));

// verbose_json 的支援不能假設永遠都在（換模型、API 改版都可能讓 segments 消失）。
// 拿不到就退回整段文字 —— 逐字稿仍然完整，只是姓名的粒度變粗。
window.fetch = async () => ({
  ok: true, status: 200, headers: { get: () => null },
  json: async () => ({ text: '只有整段文字' }),
});
const noParts = await groqTranscribe(new Float32Array(160));
check('沒有 segments 時仍然拿得到整段文字（不能整個壞掉）',
  noParts?.text === '只有整段文字' && noParts.parts.length === 0,
  JSON.stringify(noParts));

// 撞到額度不是當機，訊息要分得出來 —— 使用者看到的是逐字稿停住
window.fetch = async () => ({
  ok: false, status: 429,
  headers: { get: (h) => (h.toLowerCase() === 'retry-after' ? '42' : null) },
  json: async () => ({}),
});
let limitErr = '';
try { await groqTranscribe(new Float32Array(160)); } catch (e) { limitErr = e.message; }
check('額度用完時說得出是額度問題，不是當機',
  limitErr.includes('額度') && limitErr.includes('42'), limitErr);

window.fetch = async () => ({ ok: false, status: 401, headers: { get: () => null }, json: async () => ({}) });
let authErr = '';
try { await groqTranscribe(new Float32Array(160)); } catch (e) { authErr = e.message; }
check('金鑰被拒時直接叫使用者去看設定頁',
  authErr.includes('金鑰') && authErr.includes('設定頁'), authErr);

// ── 雲端的積壓處置是「合併」，不是「丟掉」 ──────────────────────
// 雲端的瓶頸是每分鐘 20 次請求，不是算得多快。丟掉等於白白丟掉使用者
// 講的話；合併不會 —— 兩段黏起來送一次，內容一個字都不會少。
sent.length = 0;
pending = [];
dropped = 0;
merged = 0;
transcribe = null;              // pump 不會真的送出，佇列只會累積
engineName = 'groq';
lastCloudSentAt = Date.now();   // 假裝剛送過，節流窗還沒過
for (let i = 0; i < 4; i++) enqueue(new Float32Array(16000), 1000 + i);
check('雲端積壓時合併成一段，不丟掉', pending.length === 1, `佇列 ${pending.length} 段`);
check('沒有任何一段被丟掉', dropped === 0, String(dropped));
check('合併的段數有記錄', merged === 3, String(merged));
check('合併後的音訊是四段加起來的長度',
  pending[0].audio.length === 4 * 16000, String(pending[0].audio.length));
check('保留最早那段的說話時間（排序才不會亂）',
  pending[0].startedAt === 1000, String(pending[0].startedAt));

// 合併有上限：超過 whisper 的 30 秒窗反而要多跑一輪編碼器，
// 而且一段太長會讓逐字稿變成一大塊、難讀也難對上說話者
pending = [];
merged = 0;
enqueue(new Float32Array(27 * 16000), 5000);
enqueue(new Float32Array(5 * 16000), 6000);
check('超過合併上限就另起一段', pending.length === 2, `佇列 ${pending.length} 段`);

// 節流：還沒到時間就不送，但**不能丟掉**佇列裡的東西
pending = [];
transcribe = async () => '測試';
lastCloudSentAt = Date.now();
enqueue(new Float32Array(16000), 7000);
check('節流期間工作留在佇列裡等，不會消失', pending.length === 1, `佇列 ${pending.length} 段`);
check('節流期間不會送出', busy === false);

// 節流窗過了就送得出去
pending = [];
sent.length = 0;
lastResultText = '';
toTraditionalOn = false;
lastCloudSentAt = 0;
speakerLabel = '其他人（雲端辨識）';
enqueue(new Float32Array(16000), 8000);
await Promise.resolve(); await Promise.resolve(); await Promise.resolve();
check('節流窗過了就會送出並產生逐字稿',
  sent.some((m) => m.type === 'ma:segment'),
  JSON.stringify(sent.map((m) => m.type)));
check('雲端辨識的段落標成雲端來源',
  sent.find((m) => m.type === 'ma:segment')?.payload.speaker === '其他人（雲端辨識）',
  sent.find((m) => m.type === 'ma:segment')?.payload.speaker);

// ── 一句一段送出，每一句帶自己的說話時間 ────────────────────────
//
// 這是「顯示每個人的名字」的關鍵。whisper 不做說話者分離，背景只能拿
// 說話時間去對字幕記到的人 —— 而雲端這條為了守住 20 RPM 會把音訊合併到
// 28 秒，28 秒裡換三次人很正常。整塊只送一段的話，三個人的話會全部
// 掛在同一個人頭上，而畫面上看起來完全正常。
sent.length = 0;
lastResultText = '';
toTraditionalOn = false;
handleResult({
  text: '那我開始今天的報告。準備好就可以開始了。那我們先看金流。',
  parts: [
    { start: 0, end: 3, text: '那我開始今天的報告。' },
    { start: 3.5, end: 6, text: '準備好就可以開始了。' },
    { start: 12.25, end: 15, text: '那我們先看金流。' },
  ],
}, 1700000000000);
const pieces = sent.filter((m) => m.type === 'ma:segment').map((m) => m.payload);
check('三句話送成三段，不是黏成一段', pieces.length === 3,
  `${pieces.length} 段：${JSON.stringify(pieces.map((p) => p.text))}`);
check('每一段的說話時間是「這塊音訊起點 + 該句的相對秒數」',
  pieces[0]?.startedAt === 1700000000000
  && pieces[1]?.startedAt === 1700000003500
  && pieces[2]?.startedAt === 1700000012250,
  JSON.stringify(pieces.map((p) => p.startedAt)));
// 同一塊音訊的幾句話會在同一毫秒送出。id 只用 Date.now() 的話它們會拿到
// 同一個 id，背景的 upsertSegment 會**互相覆蓋**，28 秒最後只剩一句。
check('每一段的 id 都不同（否則背景會互相覆蓋，只剩最後一句）',
  new Set(pieces.map((p) => p.id)).size === 3,
  JSON.stringify(pieces.map((p) => p.id)));
check('內容照原順序，一句都沒少',
  pieces.map((p) => p.text).join('') === '那我開始今天的報告。準備好就可以開始了。那我們先看金流。',
  JSON.stringify(pieces.map((p) => p.text)));

// 上一塊音訊尾巴的重複要扣掉，而且要從**最前面的句子**扣 ——
// 不然重疊的內容會又出現一次。
sent.length = 0;
lastResultText = '前面講完的話結尾在這裡。';
handleResult({
  text: '結尾在這裡。這是新的內容。',
  parts: [
    { start: 0, end: 2, text: '結尾在這裡。' },
    { start: 2, end: 4, text: '這是新的內容。' },
  ],
}, 1700000100000);
const dedup = sent.filter((m) => m.type === 'ma:segment').map((m) => m.payload.text);
check('重疊的開頭被扣掉，不會重複出現',
  dedup.join('') === '這是新的內容。', JSON.stringify(dedup));

// 整段看起來正常，但其中一句可能是 whisper 的雜訊標記
sent.length = 0;
lastResultText = '';
handleResult({
  text: '我們開始吧。[BLANK_AUDIO]那就這樣。',
  parts: [
    { start: 0, end: 2, text: '我們開始吧。' },
    { start: 2, end: 4, text: '[BLANK_AUDIO]' },
    { start: 4, end: 6, text: '那就這樣。' },
  ],
}, 1700000200000);
check('逐句過濾雜訊（整段正常但其中一句是 [BLANK_AUDIO]）',
  sent.filter((m) => m.type === 'ma:segment').length === 2,
  JSON.stringify(sent.filter((m) => m.type === 'ma:segment').map((m) => m.payload.text)));

// 本機引擎回的是純字串，那條路不能被改壞
sent.length = 0;
lastResultText = '';
handleResult('本機引擎回的是一整段字串。', 1700000300000);
check('本機引擎的純字串照舊處理（沒有 parts 也要能用）',
  sent.filter((m) => m.type === 'ma:segment').length === 1
  && sent.find((m) => m.type === 'ma:segment')?.payload.text === '本機引擎回的是一整段字串。',
  JSON.stringify(sent.filter((m) => m.type === 'ma:segment').map((m) => m.payload.text)));

// ── 聲紋分離：把不同的聲音分開 ──────────────────────────────────
//
// 這是「顯示誰在說話」最後一條、也是唯一不依賴畫面的路。
// 字幕要使用者自己開；發言指示器在**看共享畫面時完全不存在**
// （Teams／Meet 那時不顯示視訊磚）—— 而共享畫面正是最需要逐字稿的場合。
// 聲紋只看聲音，所以那些情況全都不影響它。
//
// **合成的聲音證明的是「演算法會把不同音色分開、把同音色歸在一起」，
// 不能證明真人的聲音一定分得開。** 真人的驗證只能在真實會議裡做。
{
  const vp = globalThis.__MA_VOICEPRINT__;
  check('voiceprint.js 有載入', !!vp && typeof vp.embed === 'function');

  // 合成「人聲」：基頻 + 幾個泛音，泛音的強度分佈就是音色。
  // 兩個人的差別做成「基頻不同 + 共振峰不同」，那正是真人聲音的主要差異。
  const synth = (f0, formants, seconds = 1.2, seed = 1) => {
    const n = Math.round(TARGET_RATE * seconds);
    const out = new Float32Array(n);
    let rnd = seed;
    const noise = () => { rnd = (rnd * 1103515245 + 12345) & 0x7fffffff; return (rnd / 0x7fffffff) - 0.5; };
    for (let i = 0; i < n; i++) {
      const t = i / TARGET_RATE;
      let v = 0;
      for (let h = 1; h <= 20; h++) {
        const freq = f0 * h;
        // 共振峰：靠近 formant 中心的泛音放大，那是音色的來源
        let gain = 1 / h;
        for (const f of formants) gain *= 1 + 2.5 * Math.exp(-((freq - f) ** 2) / (2 * 180 ** 2));
        v += gain * Math.sin(2 * Math.PI * freq * t);
      }
      // 一點雜訊與音量起伏，讓它不是完美的週期訊號
      out[i] = 0.25 * v * (0.8 + 0.2 * Math.sin(2 * Math.PI * 3 * t)) + 0.01 * noise();
    }
    return out;
  };

  const voiceA1 = synth(120, [700, 1200], 1.2, 7);    // 低沉
  const voiceA2 = synth(122, [710, 1180], 1.4, 99);   // 同一個人，另一句話
  const voiceB1 = synth(210, [500, 2100], 1.3, 31);   // 高亢、共振峰完全不同

  const eA1 = vp.embed(voiceA1, TARGET_RATE);
  const eA2 = vp.embed(voiceA2, TARGET_RATE);
  const eB1 = vp.embed(voiceB1, TARGET_RATE);
  check('算得出聲紋向量', !!eA1 && eA1.length === 26, eA1 ? String(eA1.length) : 'null');

  const same = vp.cosine(eA1, eA2);
  const diff = vp.cosine(eA1, eB1);
  check('同一個人的兩句話比較像，不同人的比較不像',
    same > diff, `同人 ${same.toFixed(3)} vs 不同人 ${diff.toFixed(3)}`);

  // 太短、或幾乎全靜音的段落要回 null，不能回一個亂猜的向量 ——
  // 亂猜會污染分群中心，錯一次之後整場都跟著錯。
  check('太短的音訊不給答案（寧可沒有，也不要亂猜）',
    vp.embed(new Float32Array(200), TARGET_RATE) === null);
  check('幾乎全靜音的音訊不給答案',
    vp.embed(new Float32Array(TARGET_RATE), TARGET_RATE) === null);

  // 分群：同一個人歸在一起，不同人分開
  const book = new vp.SpeakerBook();
  const a1 = book.assign(eA1);
  const a2 = book.assign(eA2);
  const b1 = book.assign(eB1);
  check('第一句開一個新的講者', a1?.isNew === true && a1.id === 1, JSON.stringify(a1));
  check('同一個人的第二句歸到同一群',
    a2?.id === a1?.id, `${JSON.stringify(a1)} vs ${JSON.stringify(a2)}`);
  check('另一個人開新的一群',
    b1?.id !== a1?.id, `${JSON.stringify(a1)} vs ${JSON.stringify(b1)}`);
  check('標籤預設是「講者 N」', book.labelFor(a1.id) === '講者 1', book.labelFor(a1.id));

  // **這條是整個設計的關鍵。** 字幕只要對上過一次，之後同一個聲音
  // 都叫得出名字 —— 即使字幕後來斷掉、或畫面切到共享畫面沒有視訊磚了。
  book.nameCluster(a1.id, 'Eden');
  check('對上一次真名之後，同一群就記住了', book.labelFor(a1.id) === 'Eden', book.labelFor(a1.id));
  check('別人那一群不受影響', book.labelFor(b1.id) === `講者 ${b1.id}`, book.labelFor(b1.id));

  // 上限：會議不會有 12 個人輪流講，無上限的話雜訊會生出一堆假講者
  const small = new vp.SpeakerBook({ threshold: 0.999, maxSpeakers: 2 });
  small.assign(eA1); small.assign(eB1);
  const third = small.assign(vp.embed(synth(300, [800, 2600], 1.2, 55), TARGET_RATE));
  check('額滿之後不再開新的講者（併進最近的一群）',
    small.describe().length === 2 && third?.isNew !== true,
    JSON.stringify(small.describe()));

  check('算不出來時不會爆', book.assign(null) === null);
}

// ── 聲紋分群的 id 要送到背景 ────────────────────────────────────
// 名字的判斷全部留在背景（那裡才有字幕與指示器的資料），offscreen 只回答
// 「這一段跟前面哪一段是同一個人」。分兩邊是為了讓背景只要對上過一次真名，
// 之後那一群的每一段都能顯示真名。
{
  sent.length = 0;
  lastResultText = '';
  toTraditionalOn = false;
  speakerBook = null;
  // 一段真的有聲音的音訊，聲紋才算得出來
  const n = Math.round(TARGET_RATE * 1.5);
  const voice = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const t = i / TARGET_RATE;
    voice[i] = 0.3 * (Math.sin(2 * Math.PI * 130 * t) + 0.5 * Math.sin(2 * Math.PI * 700 * t));
  }
  handleResult({ text: '這一段有聲音。', parts: [{ start: 0, end: 1.5, text: '這一段有聲音。' }] },
    1700000400000, voice);
  const withCluster = sent.find((m) => m.type === 'ma:segment')?.payload;
  check('段落帶著聲紋分群的 id', withCluster?.cluster >= 1, JSON.stringify(withCluster?.cluster));
  check('說話者預設標成「講者 N」，不是「其他人」',
    withCluster?.speaker === `講者 ${withCluster.cluster}`, withCluster?.speaker);

  // 算不出聲紋時要退回原本的引擎標籤，而不是顯示「講者 0」
  sent.length = 0;
  lastResultText = '';
  speakerLabel = '其他人（雲端辨識）';
  handleResult('沒有音訊可以算聲紋。', 1700000500000, null);
  const noCluster = sent.find((m) => m.type === 'ma:segment')?.payload;
  check('算不出聲紋時退回引擎標籤（不是「講者 0」）',
    noCluster?.speaker === '其他人（雲端辨識）' && noCluster?.cluster === 0,
    `${noCluster?.speaker} / cluster=${noCluster?.cluster}`);
}

// ── 持續失敗時不要洗版 ──────────────────────────────────────────
// 辨識錯誤幾乎都是持續性的（金鑰被拒、額度用完、網路斷掉），一旦發生，
// 接下來每一段都會用一模一樣的訊息再失敗一次。雲端約 3–5 秒一段，
// 一小時就是好幾百則相同的橫幅 —— 真正該看到的訊息會被整個洗掉，
// 而且畫面看起來像擴充功能自己壞了。
sent.length = 0;
pending = [];
sameError = { message: '', count: 0 };
transcribe = async () => { throw new Error('Groq 金鑰被拒（401）'); };
lastCloudSentAt = 0;
for (let i = 0; i < 6; i++) {
  pending.push({ audio: new Float32Array(16000), startedAt: 9000 + i });
  lastCloudSentAt = 0;          // 每一輪都讓節流窗過去，才會真的送出去
  await pump();
  await Promise.resolve(); await Promise.resolve();
}
const errs = sent.filter((m) => m.type === 'ma:audioError');
check('同一個錯誤連續發生時只回報一次，不洗版',
  errs.length === 1, `${errs.length} 則：${JSON.stringify(errs.map((e) => e.message))}`);
check('而且訊息說得出是金鑰問題',
  errs[0]?.message.includes('金鑰'), errs[0]?.message);

// 換了一個不同的錯誤仍然要講 —— 節流的是「重複」，不是「錯誤」
sent.length = 0;
transcribe = async () => { throw new Error('雲端辨識逾時（45 秒）'); };
pending.push({ audio: new Float32Array(16000), startedAt: 9100 });
lastCloudSentAt = 0;
await pump();
await Promise.resolve(); await Promise.resolve();
check('換成另一個錯誤時會重新回報（節流的是重複，不是錯誤本身）',
  sent.filter((m) => m.type === 'ma:audioError').length === 1,
  JSON.stringify(sent.filter((m) => m.type === 'ma:audioError').map((e) => e.message)));

// 成功一次就把計數清掉，恢復之後再壞才會立刻再講一次
sent.length = 0;
lastResultText = '';
toTraditionalOn = false;
transcribe = async () => '恢復了';
pending.push({ audio: new Float32Array(16000), startedAt: 9200 });
lastCloudSentAt = 0;
await pump();
await Promise.resolve(); await Promise.resolve();
check('成功一次之後把重複計數清掉',
  sameError.count === 0, JSON.stringify(sameError));

engineName = 'whisper-native';   // 收乾淨，免得影響之後新增的測試
transcribe = null;
sameError = { message: '', count: 0 };

// ── 收尾 ────────────────────────────────────────────────────────
const failed = results.filter((r) => r.startsWith('FAIL')).length;
results.push('---');
results.push(failed === 0 ? `全部 ${results.length - 1} 項通過` : `${failed} 項失敗`);
document.getElementById('out').textContent = results.join('\n');

})();
</script>
</body></html>
